<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Area Robotics, Interactive Map</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="foxglove-mark.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --accent: #0f62fe;
    --bg: #f6f7fb;
    --ink: #0b0d12;
    --muted: #5b6478;
    --card: #ffffff;
    --border: #e6e8ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }

  .layout { display: flex; height: 100vh; width: 100%; }
  #map { flex: 1; height: 100vh; }

  .sidebar {
    width: 320px; height: 100vh; background: var(--card);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    box-shadow: 2px 0 10px rgba(15, 23, 42, 0.04);
    z-index: 1001;
  }
  .sidebar-header {
    padding: 16px 18px 12px; border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .sidebar-header h1 {
    margin: 0 0 4px; font-size: 16px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .brand-logo {
    width: 22px; height: 22px; object-fit: contain;
    border-radius: 5px; flex-shrink: 0;
  }
  .sidebar-header p {
    margin: 0; font-size: 12px; color: var(--muted);
  }
  .sidebar-header .quote {
    margin: 6px 0 0; font-size: 12px; color: var(--muted);
    font-style: italic; line-height: 1.4;
  }
  .sidebar-header .quote em { font-style: italic; color: var(--ink); }
  .sidebar-header .quote .attrib { font-style: normal; }
  .sidebar-header .quote .reply {
    display: block; font-style: normal; font-size: 11.5px;
    margin-top: 2px; color: var(--muted);
  }
  .sidebar-search {
    margin: 10px 0 0; width: 100%;
    padding: 8px 10px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px;
    outline: none; transition: border-color 0.15s;
  }
  .sidebar-search:focus { border-color: var(--accent); }

  .sidebar-list {
    flex: 1; overflow-y: auto;
    padding: 6px 8px;
  }
  .sb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer; transition: background 0.12s;
    border: 1px solid transparent;
  }
  .sb-item:hover { background: #f0f3fa; border-color: var(--border); }
  .sb-item.active { background: #e8efff; border-color: var(--accent); }
  .sb-logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: #fff; border: 1px solid var(--border);
    object-fit: contain; padding: 3px; flex-shrink: 0;
  }
  .sb-logo-fb {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .sb-meta { min-width: 0; flex: 1; }
  .sb-name { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .sb-cat { font-size: 11px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-footer {
    padding: 10px 18px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }

  .map-overlay {
    position: absolute; top: 14px; right: 14px; z-index: 1000;
    display: flex; align-items: center; gap: 10px;
  }
  .count-pill {
    background: var(--accent); color: white; border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
  }
  .basemap-switcher {
    display: inline-flex; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px; gap: 2px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
  }
  .basemap-switcher button {
    border: none; background: transparent;
    padding: 6px 12px; font-size: 12px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    border-radius: 999px;
    transition: background 0.15s, color 0.15s;
    font-family: inherit;
  }
  .basemap-switcher button:hover { color: var(--ink); background: #f0f3fa; }
  .basemap-switcher button.active {
    background: var(--accent); color: white;
  }
  @media (max-width: 720px) {
    .basemap-switcher button { padding: 6px 8px; font-size: 11px; }
  }

  .logo-marker {
    background: white;
    border: 2px solid #fff;
    border-radius: 50%;
    width: 48px !important;
    height: 48px !important;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.08);
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }
  .logo-marker:hover {
    transform: scale(1.15);
    z-index: 1000;
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.28), 0 0 0 2px var(--accent);
  }
  .logo-marker img {
    width: 40px; height: 40px;
    object-fit: contain;
    border-radius: 50%;
    background: #fff;
  }
  .logo-marker .fallback {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: white; font-weight: 700; font-size: 18px;
    border-radius: 50%;
  }

  .company-popup { min-width: 240px; max-width: 280px; font-size: 13.5px; line-height: 1.45; }
  .company-popup .pop-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .company-popup .pop-logo {
    width: 48px; height: 48px; object-fit: contain;
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    flex-shrink: 0;
  }
  .company-popup .pop-logo-fb {
    width: 48px; height: 48px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; border-radius: 10px;
    flex-shrink: 0;
  }
  .company-popup h3 { margin: 0; font-size: 16px; }
  .company-popup .pop-cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .company-popup p.blurb { margin: 6px 0 8px; color: #2a3142; }
  .company-popup .meta { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .company-popup a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .company-popup a:hover { text-decoration: underline; }

  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-tip { box-shadow: 0 3px 12px rgba(0,0,0,0.1); }

  .tt {
    background: rgba(11, 13, 18, 0.9); color: white;
    border: none; border-radius: 6px; padding: 4px 8px;
    font-size: 12px; font-weight: 500;
  }
  .tt:before { display: none; }

  @media (max-width: 720px) {
    .sidebar { width: 260px; }
  }
</style>
</head>

  const map = L.map('map', { zoomControl: true }).setView([37.62, -122.30], 11);

    streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors', maxZoom: 19
    }),
    satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri', maxZoom: 19
    }),
    hybrid: L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri', maxZoom: 19
      }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, opacity: 0.9
      }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, opacity: 0.85
      })
    ]),
    light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CARTO', maxZoom: 20, subdomains: 'abcd'
    }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CARTO', maxZoom: 20, subdomains: 'abcd'
    })
  };

  let currentBase = basemaps.light.addTo(map);

  document.getElementById('basemap-switcher').addEventListener('click', e => {
    const btn = e.target.closest('button[data-layer]');
    if (!btn) return;
    const next = basemaps[btn.dataset.layer];
    if (!next || next === currentBase) return;
    map.removeLayer(currentBase);
    next.addTo(map);
    currentBase = next;
    document.querySelectorAll('.basemap-switcher button').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
  });

  // Multi-source logo loader: Clearbit (richest) → Google favicon (universal) → text fallback
  window.logoFallback = function(el, domain, initials, fbClass) {
    const stage = parseInt(el.dataset.stage || '0', 10);
    el.dataset.stage = stage + 1;
    if (stage === 0) {
      el.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    } else if (stage === 1) {
      el.src = `https://icons.duckduckgo.com/ip3/${domain}.ico`;
    } else {
      el.outerHTML = `<div class="${fbClass}">${initials}</div>`;
    }
  };

  function logoImgHtml(c, fallbackClass) {
    const initials = c.name[0];
    return `<img
      src="https://logo.clearbit.com/${c.domain}"
      alt="${c.name}"
      data-stage="0"
      onerror="window.logoFallback(this, '${c.domain}', '${initials}', '${fallbackClass}')"
    />`;
  }

  function buildIcon(c) {
    return L.divIcon({
      className: 'logo-marker',
      html: logoImgHtml(c, 'fallback'),
      iconSize: [48, 48],
      iconAnchor: [24, 24],
      popupAnchor: [0, -24]
    });
  }

  function buildPopup(c) {
    const initials = c.name[0];
    return `
      <div class="company-popup">
        <div class="pop-header">
          <img
            class="pop-logo"
            src="https://logo.clearbit.com/${c.domain}"
            data-stage="0"
            onerror="window.logoFallback(this, '${c.domain}', '${initials}', 'pop-logo-fb')"
          >
          <div>
            <h3>${c.name}</h3>
            <div class="pop-cat">${c.category}</div>
          </div>
        </div>
        <p class="blurb">${c.blurb}</p>
        <div class="meta">📍 ${c.address}</div>
        <div class="meta">🔗 <a href="${c.url}" target="_blank" rel="noopener">${c.url.replace(/^https?:\/\//, '')}</a></div>
      </div>
    `;
  }

  const markers = {};
  companies.forEach((c, idx) => {
    const marker = L.marker([c.lat, c.lng], { icon: buildIcon(c) }).addTo(map);
    marker.bindTooltip(c.name, { direction: 'top', offset: [0, -22], className: 'tt' });
    marker.bindPopup(buildPopup(c), { maxWidth: 300 });
    marker.on('popupopen', () => setActive(idx));
    markers[idx] = marker;
  });

  document.getElementById('count-pill').textContent = `${companies.length} companies`;

  const listEl = document.getElementById('sidebar-list');
  const searchEl = document.getElementById('search');

  function renderList(filter = '') {
    const f = filter.trim().toLowerCase();
    listEl.innerHTML = '';
    const sorted = companies
      .map((c, idx) => ({ c, idx }))
      .filter(({ c }) => !f || c.name.toLowerCase().includes(f) || c.category.toLowerCase().includes(f))
      .sort((a, b) => a.c.name.localeCompare(b.c.name));

    sorted.forEach(({ c, idx }) => {
      const row = document.createElement('div');
      row.className = 'sb-item';
      row.dataset.idx = idx;
      row.innerHTML = `
        <img class="sb-logo"
             src="https://logo.clearbit.com/${c.domain}"
             data-stage="0"
             onerror="window.logoFallback(this, '${c.domain}', '${c.name[0]}', 'sb-logo-fb')">
        <div class="sb-meta">
          <div class="sb-name">${c.name}</div>
          <div class="sb-cat">${c.category}</div>
        </div>
      `;
      row.addEventListener('click', () => {
        const m = markers[idx];
        map.flyTo([c.lat, c.lng], 14, { duration: 0.7 });
        setTimeout(() => m.openPopup(), 750);
        setActive(idx);
      });
      listEl.appendChild(row);
    });
  }

  function setActive(idx) {
    document.querySelectorAll('.sb-item').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.idx) === idx);
    });
    const active = document.querySelector('.sb-item.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  searchEl.addEventListener('input', e => renderList(e.target.value));
  renderList();
</script>
</body>
</html>
